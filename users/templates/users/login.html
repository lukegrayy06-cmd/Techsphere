{% extends 'blog/base.html' %}

{% block title %}Log In - TechSphere{% endblock %}

{% block content %}
<style>
    .cinematic-wrapper {
        perspective: 1000px;
        min-height: 80vh;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
    }

    .glow-backdrop {
        position: absolute;
        width: 350px;
        height: 350px;
        background: radial-gradient(circle, rgba(13, 110, 253, 0.35) 0%, rgba(0, 0, 0, 0) 70%);
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        filter: blur(40px);
        z-index: 0;
        animation: pulseGlow 4s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
        0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.6; }
        100% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.9; }
    }

    .avatar-stage {
        width: 120px;
        height: 120px;
        margin: 0 auto -60px auto;
        position: relative;
        z-index: 2;
        transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .avatar-card {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: linear-gradient(135deg, #0d6efd, #0dcaf0);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 10px 25px rgba(13, 110, 253, 0.4);
        border: 4px solid #ffffff;
        animation: floatAvatar 3s ease-in-out infinite alternate;
    }

    .avatar-card i {
        font-size: 3.5rem;
        color: white;
        transition: transform 0.3s ease;
    }

    @keyframes floatAvatar {
        0% { transform: translateY(0px) rotate(0deg); }
        100% { transform: translateY(-12px) rotate(4deg); }
    }

    .cinematic-card {
        background: rgba(255, 255, 255, 0.9);
        backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.5);
        border-radius: 20px;
        padding: 80px 40px 40px 40px;
        width: 100%;
        max-width: 440px;
        position: relative;
        z-index: 1;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
        opacity: 0;
        transform: translateY(40px) scale(0.95);
        animation: cardEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards 0.2s;
    }

    @keyframes cardEntrance {
        to {
            opacity: 1;
            transform: translateY(0) scale(1);
        }
    }

    .form-control-cinematic {
        border-radius: 12px;
        padding: 12px 16px;
        border: 1.5px solid #e2e8f0;
        transition: all 0.3s ease;
    }

    .form-control-cinematic:focus {
        border-color: #0d6efd;
        box-shadow: 0 0 0 4px rgba(13, 110, 253, 0.15);
    }
</style>

<div class="cinematic-wrapper">
    <div class="glow-backdrop"></div>

    <div class="d-flex flex-column align-items-center w-100">
        <div class="avatar-stage" id="avatarStage">
            <div class="avatar-card">
                <i class="bi bi-shield-lock-fill" id="avatarIcon"></i>
            </div>
        </div>

        <div class="cinematic-card shadow-lg">
            <h3 class="fw-bold text-center mb-1">Welcome Back</h3>
            <p class="text-muted text-center small mb-4">Enter your details to access your account</p>

            <form method="POST">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold small text-secondary">Username</label>
                    <input type="text" name="username" class="form-control form-control-cinematic" id="usernameInput" required placeholder="e.g. alex_tech" autofocus>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold small text-secondary">Password</label>
                    <input type="password" name="password" class="form-control form-control-cinematic" id="passwordInput" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn btn-primary w-100 fw-semibold py-2 mt-3 rounded-3 shadow-sm">
                    Log In <i class="bi bi-arrow-right ms-1"></i>
                </button>
            </form>

            <div class="text-center mt-4 border-top pt-3">
                <small class="text-muted">Don't have an account? <a href="{% url 'register' %}" class="text-primary text-decoration-none fw-semibold">Sign Up</a></small>
            </div>
        </div>
    </div>
</div>

<script>
    const usernameInput = document.getElementById('usernameInput');
    const passwordInput = document.getElementById('passwordInput');
    const avatarIcon = document.getElementById('avatarIcon');
    const avatarStage = document.getElementById('avatarStage');

    usernameInput.addEventListener('focus', () => {
        avatarIcon.className = 'bi bi-person-fill-check';
        avatarStage.style.transform = 'scale(1.1) translateY(-5px)';
    });

    passwordInput.addEventListener('focus', () => {
        avatarIcon.className = 'bi bi-eye-slash-fill';
        avatarStage.style.transform = 'scale(1.05) rotate(-5deg)';
    });

    [usernameInput, passwordInput].forEach(input => {
        input.addEventListener('blur', () => {
            avatarIcon.className = 'bi bi-shield-lock-fill';
            avatarStage.style.transform = 'scale(1) translateY(0)';
        });
    });
</script>
{% endblock %}
